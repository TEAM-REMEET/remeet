# PostgreSQL 을 내 컴퓨터에서 띄우기
#   docker compose up -d        # 켜기 (백그라운드)
#   docker compose ps           # 상태 보기 (STATUS 에 healthy 가 보이면 준비 완료)
#   docker compose down         # 끄기 (데이터는 남음)
#   docker compose down -v      # 끄고 데이터까지 지우기
services:
  db:
    image: postgres:16
    container_name: remeet-postgres
    environment:
      POSTGRES_USER: remeet
      POSTGRES_PASSWORD: remeet
      POSTGRES_DB: remeet
      TZ: Asia/Seoul
    ports:
      - "5432:5432"          # 내 컴퓨터 5432 포트 → 컨테이너 5432 포트
    volumes:
      - pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터가 남도록
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remeet -d remeet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
