# RE:MEET 배포 구성
#
# 로컬:  deploy 폴더에서  docker compose up --build
#        → http://localhost 접속
# 서버:  WEB_IMAGE 에 GHCR 이미지 주소를 넣고
#        docker compose pull && docker compose up -d --no-build

services:
  web:
    image: ${WEB_IMAGE:-remeet-web:local}
    build:
      context: ../apps/web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000 # 웹 → 백엔드는 컨테이너끼리 직접 호출
    expose:
      - "8501"

  backend:
    image: ${BACKEND_IMAGE:-remeet-backend:local}
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - path: .env # 비밀값(API 키, Neo4j 접속 정보). .env.example 참고
        required: false
    environment:
      # PostgreSQL 은 아래 postgres 컨테이너 (비밀번호는 .env 의 POSTGRES_PASSWORD)
      DATABASE_URL: postgresql://remeet:${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}@postgres:5432/remeet
    volumes:
      - backend_outputs:/app/outputs # summary.json · 재실행용 단계별 LLM 응답 (외부 저장소 연결 전까지)
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # 회의 목록 · 권한 · 상태 · 공유 · 알림 · 검색 (backend/src/followup/adapters/postgres)
    # 표 만들기 · 업데이트: docker compose exec backend python -m followup.entrypoints.seed_postgres migrate
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: remeet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}
      POSTGRES_DB: remeet
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data # 컨테이너를 다시 만들어도 데이터 유지
    expose:
      - "5432" # 컨테이너끼리만 (외부 포트 열지 않음)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remeet -d remeet"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  backend_outputs:
  pgdata:
