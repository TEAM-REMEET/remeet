# Streamlit은 웹소켓(/_stcore/stream)으로 화면을 주고받으므로 Upgrade 헤더 전달이 필수
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;  # 회의록 파일 업로드 대비

    # 백엔드(FastAPI)가 생기면 주석 해제
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_buffering off;       # SSE 실시간 전달
    #     proxy_read_timeout 3600s;
    # }

    location / {
        proxy_pass http://web:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;  # 화면을 오래 열어둬도 연결이 끊기지 않게
    }
}